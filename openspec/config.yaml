project:
  name: marta-orozco-quiro
  goal: Single-page Astro landing page for "Marta Orozco | Quiromasajista" in Spanish.

context:
  source_of_truth: astro-migration-context.md
  repo_state: astro-landing-page
  current_artifacts:
    - README.md
    - openspec/changes/adopt-astro-tailwind/
    - openspec/changes/refactor-header/
    - openspec/changes/add-client-reviews/
  intended_stack:
    - Astro 7
    - Tailwind CSS 4 (@tailwindcss/vite)
    - TypeScript (+ @astrojs/check)
  styling_convention: >
    Tailwind utilities in .astro templates for layout, spacing, color, and type.
    One stylesheet: src/styles/global.css with @import "tailwindcss",
    @custom-variant dark (&:where(.dark, .dark *)), and @theme brand tokens.
    Named leftover CSS only for the written allow-list (hard CSS + JS-injected
    widgets such as btn-brand, pricing pills, massage carousel). @apply is last
    resort. No Sass.

persistence:
  mode: hybrid
  local_registry: .atl/skill-registry.md
  memory_project: marta-orozco-quiro

strict_tdd: false

testing:
  detected_at: 2026-08-21
  test_runner:
    available: false
    framework: null
    command: null
  layers:
    unit:
      available: false
      tool: null
    integration:
      available: false
      tool: null
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: null
  quality:
    linter:
      available: false
      command: null
    type_checker:
      available: true
      command: npx astro check
    formatter:
      available: false
      command: null

rules:
  apply:
    guidelines:
      - Use Tailwind utilities in .astro templates; do not restyle with a named-class-first system.
      - Keep leftover named classes on the allow-list in src/styles/global.css; do not grow it for ordinary layout.
      - Dark mode follows html.dark via the class custom variant, not prefers-color-scheme alone.
      - Do not add Sass or a second global stylesheet.

workflow:
  review_line_budget: 400
  init_next: sdd-explore
  feature_name_hint: add-client-reviews
  phases:
    - sdd-explore
    - sdd-propose
    - sdd-spec
    - sdd-design
    - sdd-tasks
    - sdd-apply
    - sdd-verify
    - sdd-archive
