assumptions:
  - Mobile-first header: hamburger + overlay drawer on small viewports; inline nav on lg+.
  - Hamburger uses a Font Awesome icon and is not wrapped in extra bar spans or wrapping containers.
  - Theme control is icon-only; dropdown labels are Claro, Oscuro, Dispositivo.
  - On mobile, theme selector lives in the side menu, below Reservar.
  - Side menu slides in from the right over content; main content does not shift.
  - Overlay markup is a sibling of header, not inside it, because header backdrop-blur creates a fixed containing block.
